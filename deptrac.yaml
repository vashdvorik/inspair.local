deptrac:
  paths:
    - app

  layers:
    - name: Domain
      collectors:
        - type: directory
          regex: '^app/Domain/.*'
    - name: Application
      collectors:
        - type: directory
          regex: '^app/Application/.*'
    - name: Infrastructure
      collectors:
        - type: directory
          regex: '^app/Infrastructure/.*'
    - name: Http
      collectors:
        - type: directory
          regex: '^app/Http/.*'
    - name: Console
      collectors:
        - type: directory
          regex: '^app/Console/.*'
    - name: Support
      collectors:
        - type: directory
          regex: '^app/Support/.*'

  ruleset:
    Domain: ~
    Application:
      - Domain
    Infrastructure:
      - Application
      - Domain
    Http:
      - Application
      - Domain
      - Support
    Console:
      - Application
      - Domain
      - Support
    Support:
      - Domain
